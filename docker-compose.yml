version: '3.8'

services:
  db:
    image: mysql:8
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - devops-net

  devops-app:
    image: bedhiafixokba/devops:latest
    container_name: devops-app
    ports:
      - "8089:8089"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
    networks:
      - devops-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prom
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - devops-net

  grafana:
    image: grafana/grafana:latest
    container_name: graf
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "grafana"
    volumes:
      - C:\GrafanaProvisioning:/var/lib/grafana  # Mount the local directory
    depends_on:
      - prometheus
    networks:
      - devops-net

volumes:
  db_data:

networks:
  devops-net:
